<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TeacherBox</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="bar">
    <div class="logo">T</div>
    <h1>TeacherBox</h1>
    <span class="ver" id="version">v1.1.5</span>
    <div class="acts">
      <button class="btn" id="btn-folder">目录</button>
      <button class="btn" id="btn-import">导入</button>
      <button class="btn" id="btn-refresh">刷新</button>
      <button class="btn" id="btn-hide">托盘</button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab on" id="tab-local" data-view="local">本机工具</button>
    <button class="tab" id="tab-market" data-view="market">工具市场</button>
    <span class="count" id="counter">0</span>
  </div>

  <main class="content">
    <div id="view-local">
      <div class="searchbar">
        <input id="search" type="text" placeholder="过滤" spellcheck="false" />
      </div>
      <div id="warnings" class="warn hidden"></div>
      <div id="grid" class="grid"></div>
      <div id="empty" class="empty hidden">还没有工具。到「工具市场」下几个，或者把 zip 拖进窗口。</div>
    </div>

    <div id="view-market" class="hidden">
      <div class="searchbar">
        <span class="hint" id="market-note">清单来自 GitHub Pages，一次取 50 个，拉不动就开 Watt Toolkit 里的加速</span>
        <button class="link" id="btn-market-refresh">重新拉清单</button>
      </div>
      <div id="market-error" class="warn hidden"></div>
      <div id="market-grid" class="grid"></div>
      <div id="market-empty" class="empty hidden">清单是空的。</div>
      <div class="searchbar market-more">
        <span class="hint" id="market-stat"></span>
        <button class="link" id="btn-market-more">加载更多</button>
      </div>
    </div>
  </main>

  <section class="console hidden">
    <pre id="log"></pre>
    <button class="link" id="btn-clear">清空</button>
  </section>

  <div id="dropmask" class="dropmask hidden">
    <div class="dropmask-inner">松手就装</div>
  </div>

  <div id="modal" class="modal hidden">
    <div class="sheet">
      <div class="sheet-head">
        <div>
          <div class="sheet-title" id="modal-title">帮助</div>
          <div class="sheet-path" id="modal-sub"></div>
        </div>
        <button class="btn" id="modal-close">关闭</button>
      </div>
      <div class="sheet-body markdown" id="modal-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
