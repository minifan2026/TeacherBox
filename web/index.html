<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TeacherBox</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="bar">
    <div class="logo">T</div>
    <h1>TeacherBox</h1>
    <span class="ver" id="version">v1.0.0</span>
    <div class="acts">
      <button class="btn" id="btn-folder">目录</button>
      <button class="btn" id="btn-refresh">刷新</button>
      <button class="btn" id="btn-hide">托盘</button>
    </div>
  </header>

  <main class="content">
    <div class="searchbar">
      <input id="search" type="text" placeholder="过滤" spellcheck="false" />
      <span class="count" id="counter">0</span>
    </div>

    <div id="warnings" class="warn hidden"></div>
    <div id="grid" class="grid"></div>
    <div id="empty" class="empty hidden">tools 目录是空的。</div>
  </main>

  <section class="console hidden">
    <pre id="log"></pre>
    <button class="link" id="btn-clear">清空</button>
  </section>

  <div id="modal" class="modal hidden">
    <div class="sheet">
      <div class="sheet-head">
        <div>
          <div class="sheet-title" id="modal-title">帮助</div>
          <div class="sheet-path" id="modal-sub"></div>
        </div>
        <button class="btn" id="modal-close">关闭</button>
      </div>
      <div class="sheet-body markdown" id="modal-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
